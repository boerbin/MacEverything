[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "maceverything-ai"
version = "0.1.0"
description = "AI service for MacEverything semantic search"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "httpx>=0.28.0",
    "pydantic>=2.10.0",
    "sse-starlette>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24.0",
    "psutil>=6.0",
]
cloud = [
    "anthropic>=0.42.0",
]

[project.scripts]
maceverything-ai = "maceverything_ai.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/maceverything_ai"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
