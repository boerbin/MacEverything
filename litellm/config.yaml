# LiteLLM Unified Model Gateway
# All local apps call localhost:19861, LiteLLM routes to the right backend.
# Start with: litellm --config config.yaml --port 19861

model_list:

  # =====================================================
  # Local Ollama Models
  # =====================================================

  # MacEverything — NL-to-Query translation
  - model_name: "mac/translate"
    litellm_params:
      model: "ollama/qwen2.5:3b"
      api_base: "http://localhost:11434"

  # MacEverything — Embedding generation
  - model_name: "mac/embed"
    litellm_params:
      model: "ollama/bge-m3"
      api_base: "http://localhost:11434"

  # MacEverything — File summarization
  - model_name: "mac/summarize"
    litellm_params:
      model: "ollama/qwen2.5:3b"
      api_base: "http://localhost:11434"

  # General-purpose local models (direct access)
  - model_name: "qwen2.5:3b"
    litellm_params:
      model: "ollama/qwen2.5:3b"
      api_base: "http://localhost:11434"

  - model_name: "bge-m3"
    litellm_params:
      model: "ollama/bge-m3"
      api_base: "http://localhost:11434"

  # =====================================================
  # Remote Models — idealab gateway
  # =====================================================

  # Used by: info-get (rss-info-get)
  - model_name: "gpt-5.4-0305-global"
    litellm_params:
      model: "openai/gpt-5.4-0305-global"
      api_base: "https://idealab.alibaba-inc.com/api/openai/v1"
      api_key: "808ecbfc0cf4b733bc703968c8252478"

  # Used by: bee
  - model_name: "gemini-2.0-flash"
    litellm_params:
      model: "openai/gemini-2.0-flash"
      api_base: "https://idealab.alibaba-inc.com/api/openai/v1"
      api_key: "808ecbfc0cf4b733bc703968c8252478"

  # Used by: scholaraio
  - model_name: "gemini-3-pro-preview"
    litellm_params:
      model: "openai/gemini-3-pro-preview"
      api_base: "https://idealab.alibaba-inc.com/api/openai/v1"
      api_key: "808ecbfc0cf4b733bc703968c8252478"

general_settings:
  master_key: "sk-local-dev"
